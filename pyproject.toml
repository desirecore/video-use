[project]
name = "video-use"
version = "0.2.0"
description = "Conversation-driven video editor skill"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "requests",
    "librosa",
    "matplotlib",
    "pillow",
    "numpy",
]

[project.optional-dependencies]
animations = ["manim"]
local = [
    "faster-whisper==1.2.1",
    "ctranslate2==4.9.1",
    "speechbrain==1.1.2",
    "torch==2.10.0",
    "torchaudio==2.10.0",
    "transformers==4.57.6",
    "sherpa-onnx==2.0.3",
    "opencc-python-reimplemented",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]
torchaudio = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []

[tool.uv]
# The skill runs its helpers directly and needs only the locked dependencies.
package = false
